<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="The KITE k1 handheld, push-to-talk button glowing as it listens">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .ring { fill: none; stroke: #ffffff; transform-origin: 1058px 385px; animation: ring 2.8s ease-out infinite; }
    .ring2 { animation-delay: 1.4s; }
    @keyframes ring { from { transform: scale(.4); opacity: .8; } to { transform: scale(2.4); opacity: 0; } }
    .wave rect { transform-box: fill-box; transform-origin: center; animation: wave 1.1s ease-in-out infinite alternate; }
    .wave rect:nth-child(2) { animation-delay: .15s; } .wave rect:nth-child(3) { animation-delay: .3s; }
    .wave rect:nth-child(4) { animation-delay: .45s; } .wave rect:nth-child(5) { animation-delay: .6s; }
    @keyframes wave { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a7a7a"/><stop offset=".5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3b3b3"/><stop offset="1" stop-color="#6a6a6a"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="790" rx="380" ry="40" fill="#000" opacity=".75" filter="url(#blur)"/>

  <!-- device in 3/4 view -->
  <g transform="translate(560 190)">
    <!-- side thickness -->
    <path d="M440 40 L500 70 L500 520 L440 480 Z" fill="url(#side)"/>
    <path d="M30 480 L440 480 L500 520 L90 520 Z" fill="#6a6a6a"/>
    <!-- face -->
    <rect width="440" height="480" rx="60" fill="url(#body)"/>
    <rect x="3" y="3" width="434" height="474" rx="58" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
    <!-- screen -->
    <rect x="34" y="60" width="290" height="290" rx="26" fill="#0a0a0a"/>
    <text x="179" y="130" text-anchor="middle" font-size="20" fill="#868686">listening…</text>
    <g class="wave" fill="#ffffff" transform="translate(119 170)">
      <rect x="0" y="0" width="16" height="70" rx="8"/><rect x="28" y="0" width="16" height="70" rx="8"/>
      <rect x="56" y="0" width="16" height="70" rx="8"/><rect x="84" y="0" width="16" height="70" rx="8"/>
      <rect x="112" y="0" width="16" height="70" rx="8"/>
    </g>
    <text x="179" y="300" text-anchor="middle" font-size="19" fill="#ebe8e2">"book a table for four, 8pm"</text>
    <!-- camera -->
    <rect x="344" y="60" width="66" height="150" rx="33" fill="#1a1a1a"/>
    <circle cx="377" cy="104" r="20" fill="#060606" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="370" cy="97" r="6" fill="#fff" opacity=".35"/>
    <!-- scroll wheel -->
    <rect x="350" y="232" width="54" height="140" rx="27" fill="#9b9b9b"/>
    <g stroke="#5a5a5a" stroke-width="2"><line x1="356" y1="252" x2="398" y2="252"/><line x1="354" y1="272" x2="400" y2="272"/><line x1="354" y1="292" x2="400" y2="292"/><line x1="354" y1="312" x2="400" y2="312"/><line x1="354" y1="332" x2="400" y2="332"/><line x1="356" y1="352" x2="398" y2="352"/></g>
    <!-- speaker -->
    <g fill="#7a7a7a"><circle cx="70" cy="410" r="5"/><circle cx="92" cy="410" r="5"/><circle cx="114" cy="410" r="5"/><circle cx="136" cy="410" r="5"/><circle cx="158" cy="410" r="5"/></g>
    <!-- side push-to-talk -->
    <rect x="490" y="150" width="16" height="90" rx="8" fill="#ffffff"/>
  </g>
  <circle class="ring" cx="1058" cy="385" r="40" stroke-width="3"/>
  <circle class="ring ring2" cx="1058" cy="385" r="40" stroke-width="3"/>

  <!-- labels -->
  <g font-size="22" fill="#ebe8e2">
    <g transform="translate(150 240)"><rect width="300" height="56" rx="28" fill="#141414" stroke="#5a5a5a"/><circle cx="30" cy="28" r="6" fill="#ffffff"/><text x="50" y="36">press the button</text></g>
    <g transform="translate(110 420)"><rect width="320" height="56" rx="28" fill="#141414" stroke="#5a5a5a"/><circle cx="30" cy="28" r="6" fill="#ffffff"/><text x="50" y="36">say what needs doing</text></g>
    <g transform="translate(150 600)"><rect width="300" height="56" rx="28" fill="#141414" stroke="#5a5a5a"/><circle cx="30" cy="28" r="6" fill="#ffffff"/><text x="50" y="36">KITE takes it from here</text></g>
  </g>
</svg>
