<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The KITE k1 device glowing white, surrounded by spoken requests">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="75%">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset=".55" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8f8f"/>
      <stop offset=".5" stop-color="#d7d7d7"/>
      <stop offset="1" stop-color="#7a7a7a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.3" fill="#ffffff" fill-opacity=".14"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="800" cy="470" r="460" fill="url(#halo)"/>

  <!-- orbit lines -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".22">
    <ellipse cx="800" cy="470" rx="560" ry="210"/>
    <ellipse cx="800" cy="470" rx="420" ry="150" stroke-dasharray="3 9"/>
  </g>

  <!-- floating thoughts -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ebe8e2">
    <g transform="translate(180 210)">
      <rect width="330" height="56" rx="28" fill="#141414" stroke="#3a3a3a"/>
      <circle cx="30" cy="28" r="6" fill="#ffffff"/>
      <text x="50" y="36">plan a weekend in lisbon</text>
    </g>
    <g transform="translate(1110 180)">
      <rect width="320" height="56" rx="28" fill="#141414" stroke="#3a3a3a"/>
      <circle cx="30" cy="28" r="6" fill="#ffffff"/>
      <text x="50" y="36">sort my downloads folder</text>
    </g>
    <g transform="translate(120 640)">
      <rect width="368" height="56" rx="28" fill="#141414" stroke="#3a3a3a"/>
      <circle cx="30" cy="28" r="6" fill="#ffffff"/>
      <text x="50" y="36">compare these three laptops</text>
    </g>
    <g transform="translate(1120 660)">
      <rect width="350" height="56" rx="28" fill="#141414" stroke="#3a3a3a"/>
      <circle cx="30" cy="28" r="6" fill="#ffffff"/>
      <text x="50" y="36">draft the quarterly update</text>
    </g>
  </g>

  <!-- device shadow -->
  <ellipse cx="800" cy="740" rx="230" ry="26" fill="#000" opacity=".7" filter="url(#soft)"/>

  <!-- KITE k1 device -->
  <g transform="translate(800 460) rotate(-8) translate(-190 -190)">
    <rect width="380" height="380" rx="56" fill="url(#body)"/>
    <rect x="3" y="3" width="374" height="374" rx="54" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    <!-- screen -->
    <rect x="30" y="52" width="244" height="244" rx="22" fill="url(#screen)"/>
    <g transform="translate(152 158)">
      <circle r="62" fill="#ffffff" opacity=".12"/>
      <path d="M0 -50 L38 -14 L0 56 L-38 -14 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 -50 V56 M-38 -14 H38" stroke="#ffffff" stroke-width="3" stroke-opacity=".8"/>
    </g>
    <rect x="72" y="248" width="160" height="6" rx="3" fill="#ebe8e2" opacity=".5"/>
    <rect x="102" y="264" width="100" height="6" rx="3" fill="#ebe8e2" opacity=".25"/>
    <!-- camera barrel -->
    <rect x="292" y="52" width="58" height="134" rx="29" fill="#1a1a1a"/>
    <circle cx="321" cy="92" r="17" fill="#060606" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="315" cy="86" r="5" fill="#ffffff" opacity=".35"/>
    <!-- scroll wheel -->
    <rect x="298" y="206" width="46" height="120" rx="23" fill="url(#wheel)"/>
    <g stroke="#5a5a5a" stroke-width="2" opacity=".7">
      <line x1="304" y1="222" x2="338" y2="222"/><line x1="302" y1="238" x2="340" y2="238"/>
      <line x1="301" y1="254" x2="341" y2="254"/><line x1="301" y1="270" x2="341" y2="270"/>
      <line x1="302" y1="286" x2="340" y2="286"/><line x1="304" y1="302" x2="338" y2="302"/>
    </g>
    <!-- speaker grille -->
    <g fill="#7a7a7a" opacity=".7">
      <circle cx="60" cy="330" r="4"/><circle cx="78" cy="330" r="4"/><circle cx="96" cy="330" r="4"/>
      <circle cx="114" cy="330" r="4"/><circle cx="132" cy="330" r="4"/>
    </g>
  </g>
</svg>
